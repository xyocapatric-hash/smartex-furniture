<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Smartex Orders</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container"><span class="navbar-brand">Smartex Order Manager</span></div>
    </nav>
    <div class="container">
        <h3>Recent Customer Orders</h3>
        <table class="table table-bordered bg-white shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>Time</th>
                    <th>Phone</th>
                    <th>Item</th>
                    <th>Amount</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for order in orders %}
                <tr>
                    <td>{{ order.created_at.strftime('%H:%M') }}</td>
                    <td>0{{ order.customer_phone[-9:] }}</td>
                    <td>{{ order.product_name }}</td>
                    <td>Ksh {{ order.amount }}</td>
                    <td>
                        <span class="badge {% if order.status == 'Paid' %}bg-success{% else %}bg-warning{% endif %}">
                            {{ order.status }}
                        </span>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="/" class="btn btn-secondary">Back to Shop</a>
    </div>
</body>
</html>
