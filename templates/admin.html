<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Smartex Admin - Add Stock</title>
</head>
<body class="p-5">
    <div class="container bg-white p-4 shadow-sm" style="max-width: 600px; border-radius: 15px;">
        <h2 class="mb-4">Upload New Furniture</h2>
        <form action="/admin/upload" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Furniture Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. 3-Seater Velvet Sofa" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Price (Ksh)</label>
                <input type="number" name="price" class="form-control" placeholder="45000" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Stock Quantity</label>
                <input type="number" name="stock" class="form-control" value="1">
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="desc" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Product Image</label>
                <input type="file" name="image" class="form-control" accept="image/*" required>
            </div>
            <button type="submit" class="btn btn-dark w-100">Add to Inventory</button>
        </form>
        <a href="/" class="btn btn-link w-100 mt-2 text-decoration-none">Back to Shop</a>
    </div>
</body>
</html>
